<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>FUEL SHIM 계산</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 10px 10px calc(76px + env(safe-area-inset-bottom));
      background: #0f172a;
      color: #f1f5f9;
    }
    .app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
    .top-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .home-link {
      text-decoration: none; color: #38bdf8; font-weight: 800; font-size: 14px;
      padding: 8px 10px; background: #1e293b; border-radius: 8px; border: 1px solid #334155;
    }
    .title-wrap { text-align: center; flex: 1; }
    .title-wrap h1 { margin: 0; font-size: 17px; font-weight: 900; color: #f8fafc; }
    .title-wrap span { font-size: 11px; color: #94a3b8; }
    .top-actions { display: flex; gap: 6px; }
    .icon-btn {
      min-height: 38px; padding: 6px 10px; border-radius: 8px; border: 1px solid #475569;
      background: #1e293b; color: #e2e8f0; font-size: 12px; font-weight: 800; cursor: pointer;
    }
    .icon-btn.danger { background: #7f1d1d; border-color: #ef4444; color: #fecaca; }

    .ctrl-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 10px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .ctrl-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    select, input[type="number"] {
      font-size: 16px; font-weight: 800; border-radius: 8px; border: 1px solid #475569;
      background: #0f172a; color: #f8fafc; padding: 8px 10px; min-height: 44px;
    }
    select { width: 100%; }
    .target-box { display: flex; align-items: center; gap: 4px; }
    .step-btn {
      width: 44px; height: 44px; border-radius: 8px; border: none;
      background: #2563eb; color: #fff; font-size: 20px; font-weight: 900; cursor: pointer;
    }
    #targetNumber { width: 68px; text-align: center; padding: 6px 4px; }

    .meta-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
      font-size: 13px;
    }
    #averageDisplay { color: #38bdf8; font-weight: 900; font-family: monospace; font-size: 14px; }
    .chk-label { display: flex; align-items: center; gap: 6px; font-weight: 700; color: #cbd5e1; cursor: pointer; }
    .chk-label input { width: 20px; height: 20px; accent-color: #38bdf8; }

    .env-box {
      border-top: 1px solid #334155; padding-top: 8px; display: flex; flex-direction: column; gap: 8px;
    }
    .env-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px; }
    #envDeltaSummary { font-weight: 800; color: #34d399; font-family: monospace; }
    .env-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .env-grid.open { display: grid; }
    .env-field label { display: block; font-size: 11px; color: #94a3b8; font-weight: 700; margin-bottom: 2px; }
    .env-field input { width: 100%; text-align: center; padding: 6px 4px; }

    /* 베드 선택 탭 (모바일 한 화면 집중) */
    .bed-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .bed-tab {
      min-height: 46px; border-radius: 10px; border: 1px solid #334155;
      background: #1e293b; color: #94a3b8; font-weight: 800; font-size: 13px;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
      line-height: 1.2;
    }
    .bed-tab span.cnt { font-size: 11px; font-weight: 700; opacity: 0.85; }
    .bed-tab.active { background: #1d4ed8; border-color: #60a5fa; color: #fff; }

    /* 9기통 카드 리스트 */
    .cyl-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 8px 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .cyl-head {
      display: grid; grid-template-columns: 44px 1fr 96px; gap: 8px; padding: 0 4px 4px;
      border-bottom: 1px solid #334155; font-size: 11px; color: #94a3b8; font-weight: 800; text-align: center;
    }
    .cyl-row {
      display: grid; grid-template-columns: 44px 1fr 96px; gap: 8px; align-items: center;
    }
    .cyl-no {
      height: 46px; border-radius: 8px; background: #0f172a; border: 1px solid #334155;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 16px; color: #94a3b8; font-family: monospace;
    }
    .cyl-input-wrap { display: flex; align-items: center; gap: 4px; }
    .cyl-input {
      width: 100%; height: 46px; text-align: center; font-size: 22px !important;
      font-family: monospace; letter-spacing: 0.04em; padding: 4px 6px !important;
    }
    .cyl-clr {
      width: 34px; height: 46px; border-radius: 8px; border: 1px solid #334155;
      background: #0f172a; color: #94a3b8; font-weight: 900; font-size: 14px; cursor: pointer; flex-shrink: 0;
    }
    .cyl-res {
      height: 46px; border-radius: 8px; background: #0f172a; border: 1px solid #334155;
      display: flex; align-items: center; justify-content: center;
      font-family: monospace; font-size: 20px; font-weight: 900; color: #38bdf8;
    }
    .cyl-res.neg { color: #f87171; border-color: #7f1d1d; }
    .cyl-res.pos { color: #34d399; border-color: #065f46; }
    .cyl-res.err { color: #fbbf24; font-size: 14px; }

    /* 하단 고정 액션 바 */
    .dock {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
      background: rgba(15, 23, 42, 0.96); border-top: 1px solid #334155;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    }
    .dock button {
      min-height: 46px; border: none; border-radius: 10px; font-size: 13px; font-weight: 800; cursor: pointer;
    }
    #copyReportButton { background: #0284c7; color: #fff; }
    #shareButton { background: #059669; color: #fff; }
    #saveButton { background: #d97706; color: #fff; }
    #loadButton { background: #475569; color: #fff; }
    #loadButton.ready { background: #0e7490; }
    #loadButton.disabled { opacity: 0.45; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <a class="home-link" href="./index.html">← 메뉴</a>
      <div class="title-wrap">
        <h1 id="mainTitle">FUEL SHIM 계산</h1>
        <span id="revisionDisplay">Rev 28-Mobile</span>
      </div>
      <div class="top-actions">
        <button id="resetButton" class="icon-btn danger" type="button">초기화</button>
      </div>
    </div>

    <div class="ctrl-card">
      <div class="ctrl-row">
        <select id="typeSelect" aria-label="엔진 기종 선택">
          <option value="2.5" data-key="22CDF">22CDF (/2.5)</option>
          <option value="1.5" data-key="27DF">27DF (/1.5)</option>
          <option value="0.8" data-key="35DF">35DF (/0.8)</option>
          <option value="2" data-key="21/32_25/33">21/32 & 25/33 (/2)</option>
          <option value="1.3" data-key="32/40">32/40 (/1.3)</option>
        </select>
        <div class="target-box">
          <button id="decrementTarget" class="step-btn" type="button" aria-label="목표값 감소">-</button>
          <input id="targetNumber" type="number" value="144" inputmode="numeric" aria-label="목표 Pmax">
          <button id="incrementTarget" class="step-btn" type="button" aria-label="목표값 증가">+</button>
        </div>
      </div>

      <div class="meta-row">
        <span id="averageDisplay">평균: 0.0 (0개)</span>
        <label class="chk-label">
          <input id="ignoreCheckbox" type="checkbox">
          ±0.1 이하 무시
        </label>
      </div>

      <div class="env-box">
        <div class="env-head">
          <label class="chk-label">
            <input id="envEnable" type="checkbox">
            FAT 기상 보정 (ΔT·ΔRH·ΔP)
          </label>
          <span id="envDeltaSummary">미적용 (0.00 bar)</span>
        </div>
        <div id="envGrid" class="env-grid">
          <div class="env-field">
            <label for="deltaTemp">ΔT (°C)</label>
            <input id="deltaTemp" type="number" step="0.5" value="0">
          </div>
          <div class="env-field">
            <label for="deltaRh">ΔRH (%p)</label>
            <input id="deltaRh" type="number" step="1" value="0">
          </div>
          <div class="env-field">
            <label for="deltaBaro">ΔP (hPa)</label>
            <input id="deltaBaro" type="number" step="1" value="0">
          </div>
        </div>
      </div>
    </div>

    <div class="bed-tabs" id="bedTabs">
      <button class="bed-tab active" data-bed="0" type="button">1번 베드<span class="cnt">0/9</span></button>
      <button class="bed-tab" data-bed="1" type="button">2번 베드<span class="cnt">0/9</span></button>
      <button class="bed-tab" data-bed="2" type="button">3번 베드<span class="cnt">0/9</span></button>
      <button class="bed-tab" data-bed="3" type="button">4번 베드<span class="cnt">0/9</span></button>
    </div>

    <div class="cyl-card">
      <div class="cyl-head">
        <span>CYL</span>
        <span>실측 Pmax (3자리)</span>
        <span>SHIM (mm)</span>
      </div>
      <div id="cylRows" style="display:flex;flex-direction:column;gap:6px;"></div>
    </div>
  </div>

  <div class="dock">
    <button id="copyReportButton" type="button">📋 복사</button>
    <button id="shareButton" type="button">🔗 공유</button>
    <button id="saveButton" type="button">💾 저장</button>
    <button id="loadButton" type="button" class="disabled">📂 불러오기</button>
  </div>

  <script>
    (() => {
      const STORAGE_KEY = 'fuelShimData';
      const MAX_LINES = 9;
      const BED_COUNT = 4;
      const ENV_PROFILES = {
        '22CDF': { tempCoeff: -0.28, vaporCoeff: 0.04, baroCoeff: 0.04 },
        '27DF': { tempCoeff: -0.35, vaporCoeff: 0.05, baroCoeff: 0.05 },
        '35DF': { tempCoeff: -0.42, vaporCoeff: 0.06, baroCoeff: 0.06 },
        '21/32_25/33': { tempCoeff: -0.32, vaporCoeff: 0.045, baroCoeff: 0.045 },
        '32/40': { tempCoeff: -0.4, vaporCoeff: 0.055, baroCoeff: 0.055 },
      };

      const bedsData = Array.from({ length: BED_COUNT }, () => Array(MAX_LINES).fill(''));
      let activeBed = 0;

      const typeSelect = document.getElementById('typeSelect');
      const targetInput = document.getElementById('targetNumber');
      const ignoreCheckbox = document.getElementById('ignoreCheckbox');
      const envEnable = document.getElementById('envEnable');
      const envGrid = document.getElementById('envGrid');
      const envDeltaSummary = document.getElementById('envDeltaSummary');
      const deltaTempInput = document.getElementById('deltaTemp');
      const deltaRhInput = document.getElementById('deltaRh');
      const deltaBaroInput = document.getElementById('deltaBaro');
      const averageDisplay = document.getElementById('averageDisplay');
      const mainTitle = document.getElementById('mainTitle');
      const cylRows = document.getElementById('cylRows');
      const loadButton = document.getElementById('loadButton');

      const satVapor = (t) => 6.1078 * Math.pow(10, (7.5 * t) / (t + 237.3));

      const computeEnvDeltaP = () => {
        if (!envEnable.checked) return 0;
        const opt = typeSelect.options[typeSelect.selectedIndex];
        const prof = ENV_PROFILES[opt?.dataset?.key || '32/40'] || ENV_PROFILES['32/40'];
        const dt = Math.max(-50, Math.min(50, parseFloat(deltaTempInput.value) || 0));
        const drh = Math.max(-100, Math.min(100, parseFloat(deltaRhInput.value) || 0));
        const dp = Math.max(-150, Math.min(150, parseFloat(deltaBaroInput.value) || 0));
        const deltaVapor = (drh / 100) * satVapor(25 + dt);
        const dT = Number((prof.tempCoeff * dt).toFixed(2));
        const dRh = Number((-prof.vaporCoeff * deltaVapor).toFixed(2));
        const dBaro = Number((prof.baroCoeff * dp).toFixed(2));
        return Number((dT + dRh + dBaro).toFixed(2));
      };

      const calcShim = (diff, divisor) => {
        const raw = diff / divisor;
        const intPart = Math.trunc(raw);
        const decPart = Math.abs(raw - intPart);
        let adj = intPart;
        if (decPart >= 0.7) adj += raw > 0 ? 1 : -1;
        return adj / 10;
      };

      const formatShimResult = (rawStr, target, divisor, envDp, ignoreSmall) => {
        const s = (rawStr || '').trim();
        if (!s) return { text: '', cls: '' };
        if (!/^\d{3}$/.test(s)) return { text: s.length < 3 ? '입력중' : '오류', cls: 'err' };
        const n = parseInt(s, 10);
        const val = calcShim(target - (n + envDp), divisor);
        if (ignoreSmall && Math.abs(val) <= 0.1) return { text: '무시', cls: '' };
        if (Math.abs(val) < 0.1) return { text: '0.0', cls: '' };
        const str = (val > 0 ? '+' : '') + val.toFixed(1).replace(/\.0$/, '');
        return { text: str, cls: val < 0 ? 'neg' : 'pos' };
      };

      const getInitialPrefix = () => {
        const t = (targetInput.value || '144').toString();
        return t.slice(0, 2);
      };

      const updateSummaryAndTabs = () => {
        const divisor = parseFloat(typeSelect.value);
        const target = parseInt(targetInput.value, 10) || 144;
        const ignoreSmall = ignoreCheckbox.checked;
        const envDp = computeEnvDeltaP();
        const typeName = typeSelect.options[typeSelect.selectedIndex].text.split(' ')[0];
        mainTitle.textContent = `${typeName} FUEL SHIM`;

        envGrid.classList.toggle('open', envEnable.checked);
        envDeltaSummary.textContent = envEnable.checked
          ? `보정 ${envDp > 0 ? '+' : ''}${envDp.toFixed(2)} bar`
          : '미적용 (0.00 bar)';

        let sum = 0;
        let validCnt = 0;
        let filteredCnt = 0;

        document.querySelectorAll('.bed-tab').forEach((tab, idx) => {
          const filled = bedsData[idx].filter(v => /^\d{3}$/.test(v)).length;
          tab.querySelector('.cnt').textContent = `${filled}/9`;
          tab.classList.toggle('active', idx === activeBed);
          bedsData[idx].forEach(v => {
            if (/^\d{3}$/.test(v)) {
              const n = parseInt(v, 10);
              validCnt++;
              sum += n;
              const sh = calcShim(target - (n + envDp), divisor);
              if (!(ignoreSmall && Math.abs(sh) <= 0.1)) filteredCnt++;
            }
          });
        });

        const avg = validCnt > 0 ? (sum / validCnt).toFixed(1) : '0.0';
        averageDisplay.textContent = `평균: ${avg} (${filteredCnt}개)`;
      };

      const updateActiveRowsResult = () => {
        const divisor = parseFloat(typeSelect.value);
        const target = parseInt(targetInput.value, 10) || 144;
        const ignoreSmall = ignoreCheckbox.checked;
        const envDp = computeEnvDeltaP();

        for (let i = 0; i < MAX_LINES; i++) {
          const resEl = document.getElementById(`res_${i}`);
          if (!resEl) continue;
          const r = formatShimResult(bedsData[activeBed][i], target, divisor, envDp, ignoreSmall);
          resEl.textContent = r.text;
          resEl.className = `cyl-res ${r.cls}`;
        }
        updateSummaryAndTabs();
      };

      const renderBedRows = () => {
        cylRows.innerHTML = '';
        for (let i = 0; i < MAX_LINES; i++) {
          const row = document.createElement('div');
          row.className = 'cyl-row';
          row.innerHTML = `
            <div class="cyl-no">${i + 1}</div>
            <div class="cyl-input-wrap">
              <input class="cyl-input" type="text" inputmode="numeric" maxlength="3" data-idx="${i}" value="${bedsData[activeBed][i]}" placeholder="${getInitialPrefix()}_">
              <button class="cyl-clr" type="button" data-clr="${i}" aria-label="${i + 1}번 지우기">✕</button>
            </div>
            <div id="res_${i}" class="cyl-res"></div>
          `;
          cylRows.appendChild(row);
        }

        const inputs = Array.from(cylRows.querySelectorAll('.cyl-input'));
        inputs.forEach((inp, idx) => {
          inp.addEventListener('focus', () => {
            if (inp.value === '') {
              const prevVal = idx > 0 && /^\d{3}$/.test(bedsData[activeBed][idx - 1])
                ? bedsData[activeBed][idx - 1].slice(0, 2)
                : getInitialPrefix();
              inp.value = prevVal;
              bedsData[activeBed][idx] = prevVal;
              requestAnimationFrame(() => inp.setSelectionRange(prevVal.length, prevVal.length));
            }
          });
          inp.addEventListener('blur', () => {
            if (inp.value.length > 0 && inp.value.length < 3) {
              // 접두사만 남기고 비웠으면 정리
              const prefix = idx > 0 && /^\d{3}$/.test(bedsData[activeBed][idx - 1])
                ? bedsData[activeBed][idx - 1].slice(0, 2)
                : getInitialPrefix();
              if (inp.value === prefix) {
                inp.value = '';
                bedsData[activeBed][idx] = '';
              }
            }
            updateActiveRowsResult();
          });
          inp.addEventListener('input', () => {
            const cleaned = inp.value.replace(/\D/g, '').slice(0, 3);
            if (cleaned !== inp.value) inp.value = cleaned;
            bedsData[activeBed][idx] = cleaned;
            updateActiveRowsResult();
            if (cleaned.length === 3 && idx < MAX_LINES - 1) {
              inputs[idx + 1].focus();
            }
          });
        });

        cylRows.querySelectorAll('.cyl-clr').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.dataset.clr);
            bedsData[activeBed][idx] = '';
            inputs[idx].value = '';
            updateActiveRowsResult();
            inputs[idx].focus();
          });
        });

        updateActiveRowsResult();
      };

      document.getElementById('bedTabs').addEventListener('click', (e) => {
        const tab = e.target.closest('.bed-tab');
        if (!tab) return;
        activeBed = Number(tab.dataset.bed);
        renderBedRows();
      });

      document.getElementById('decrementTarget').addEventListener('click', () => {
        targetInput.value = String(Math.max(1, (parseInt(targetInput.value, 10) || 144) - 1));
        updateActiveRowsResult();
      });
      document.getElementById('incrementTarget').addEventListener('click', () => {
        targetInput.value = String((parseInt(targetInput.value, 10) || 144) + 1);
        updateActiveRowsResult();
      });
      [typeSelect, targetInput, ignoreCheckbox, envEnable, deltaTempInput, deltaRhInput, deltaBaroInput].forEach(el => {
        el.addEventListener('input', updateActiveRowsResult);
        el.addEventListener('change', updateActiveRowsResult);
      });

      document.getElementById('resetButton').addEventListener('click', () => {
        if (!confirm('모든 베드 입력값을 초기화할까요?')) return;
        typeSelect.value = '2.5';
        targetInput.value = '144';
        ignoreCheckbox.checked = false;
        envEnable.checked = false;
        deltaTempInput.value = '0';
        deltaRhInput.value = '0';
        deltaBaroInput.value = '0';
        for (let b = 0; b < BED_COUNT; b++) bedsData[b].fill('');
        window.history.replaceState({}, document.title, window.location.pathname);
        renderBedRows();
      });

      const serializeBeds = () => bedsData.map(arr => {
        let lastNonEmpty = -1;
        for (let i = arr.length - 1; i >= 0; i--) {
          if (arr[i] !== '') { lastNonEmpty = i; break; }
        }
        return lastNonEmpty >= 0 ? arr.slice(0, lastNonEmpty + 1).join('\n') : '';
      });

      const hydrateBeds = (strArr) => {
        for (let b = 0; b < BED_COUNT; b++) {
          const lines = (strArr?.[b] || '').split('\n');
          for (let i = 0; i < MAX_LINES; i++) {
            bedsData[b][i] = (lines[i] || '').replace(/\D/g, '').slice(0, 3);
          }
        }
      };

      const updateLoadBtn = () => {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          try {
            const d = JSON.parse(raw);
            const dt = new Date(d.date);
            loadButton.textContent = `📂 ${dt.getMonth() + 1}/${dt.getDate()}`;
            loadButton.classList.remove('disabled');
            loadButton.classList.add('ready');
            return;
          } catch {}
        }
        loadButton.textContent = '📂 불러오기';
        loadButton.classList.add('disabled');
        loadButton.classList.remove('ready');
      };

      document.getElementById('saveButton').addEventListener('click', () => {
        const data = {
          version: 6,
          date: Date.now(),
          target: targetInput.value,
          type: typeSelect.value,
          ignoreSmall: ignoreCheckbox.checked,
          env: {
            enabled: envEnable.checked,
            dt: deltaTempInput.value,
            drh: deltaRhInput.value,
            dp: deltaBaroInput.value,
          },
          beds: serializeBeds(),
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        updateLoadBtn();
        alert('데이터가 저장되었습니다.');
      });

      loadButton.addEventListener('click', () => {
        if (loadButton.classList.contains('disabled')) return;
        try {
          const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
          if (data.version < 4) {
            const map = { '0.4': '2.5', '0.666': '1.5', '1.25': '0.8', '0.5': '2', '0.769': '1.3' };
            data.type = map[data.type] || '2.5';
          }
          typeSelect.value = data.type || '2.5';
          targetInput.value = data.target || '144';
          ignoreCheckbox.checked = Boolean(data.ignoreSmall);
          envEnable.checked = Boolean(data.env?.enabled);
          deltaTempInput.value = data.env?.dt ?? '0';
          deltaRhInput.value = data.env?.drh ?? '0';
          deltaBaroInput.value = data.env?.dp ?? '0';
          hydrateBeds(data.beds);
          renderBedRows();
          alert('저장된 데이터를 불러왔습니다.');
        } catch {
          alert('불러오기 오류');
        }
      });

      document.getElementById('copyReportButton').addEventListener('click', async () => {
        const divisor = parseFloat(typeSelect.value);
        const target = parseInt(targetInput.value, 10) || 144;
        const ignoreSmall = ignoreCheckbox.checked;
        const envDp = computeEnvDeltaP();
        const envText = envEnable.checked
          ? `적용 (ΔT ${deltaTempInput.value}°C, ΔRH ${deltaRhInput.value}%p, ΔP ${deltaBaroInput.value}hPa → ${envDp > 0 ? '+' : ''}${envDp.toFixed(2)} bar)`
          : '미적용';
        let report = `[${typeSelect.options[typeSelect.selectedIndex].text}] FUEL SHIM 보고서\n목표값: ${target}\n환경보정: ${envText}\n생성일: ${new Date().toLocaleString('ko-KR')}\n\n`;
        let any = false;
        bedsData.forEach((arr, bIdx) => {
          const validRows = [];
          arr.forEach((v, i) => {
            if (!/^\d{3}$/.test(v)) return;
            const r = formatShimResult(v, target, divisor, envDp, false);
            if (ignoreSmall && (r.text === '0.0' || Math.abs(parseFloat(r.text)) <= 0.1)) return;
            validRows.push(`${String(i + 1).padStart(2, ' ')}    ${v}    ${r.text}`);
          });
          if (validRows.length > 0) {
            any = true;
            report += `${bIdx + 1}번 베드\n순번  입력값  결과\n------------------------\n${validRows.join('\n')}\n\n`;
          }
        });
        if (!any) return alert('복사할 유효 데이터가 없습니다.');
        try {
          await navigator.clipboard.writeText(report);
          alert('보고서가 클립보드에 복사되었습니다.');
        } catch {
          alert('복사 실패');
        }
      });

      document.getElementById('shareButton').addEventListener('click', async () => {
        const params = new URLSearchParams();
        params.set('ver', 6);
        params.set('type', typeSelect.value);
        params.set('target', targetInput.value);
        params.set('ignore', ignoreCheckbox.checked ? '1' : '0');
        if (envEnable.checked) {
          params.set('env', '1');
          params.set('dt', deltaTempInput.value);
          params.set('drh', deltaRhInput.value);
          params.set('dp', deltaBaroInput.value);
        }
        serializeBeds().forEach((s, idx) => params.set(`bed${idx + 1}`, s.split('\n').join(',')));
        const url = `${window.location.href.split('?')[0]}?${params.toString()}`;
        try {
          await navigator.clipboard.writeText(url);
          alert('공유 URL이 복사되었습니다.');
        } catch {
          alert('URL 복사 실패');
        }
      });

      const params = new URLSearchParams(window.location.search);
      if (params.toString()) {
        if (params.get('type')) {
          const map = { '0.4': '2.5', '0.666': '1.5', '1.25': '0.8', '0.5': '2', '0.769': '1.3' };
          typeSelect.value = map[params.get('type')] || params.get('type');
        }
        if (params.get('target')) targetInput.value = params.get('target');
        ignoreCheckbox.checked = params.get('ignore') === '1';
        envEnable.checked = params.get('env') === '1';
        deltaTempInput.value = params.get('dt') || '0';
        deltaRhInput.value = params.get('drh') || '0';
        deltaBaroInput.value = params.get('dp') || '0';
        hydrateBeds([1, 2, 3, 4].map(n => (params.get(`bed${n}`) || '').split(',').join('\n')));
      }

      updateLoadBtn();
      renderBedRows();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    })();
  </script>
</body>
</html>
